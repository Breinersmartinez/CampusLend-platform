<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusLend — Diagrama de Clases UML</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap');

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #1c2333;
      --border:    #30363d;
      --border2:   #21262d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --faint:     #3d444d;

      /* class header palette */
      --h-abstract: #2d1f6e;
      --h-iface:    #0d4a2e;
      --h-entity:   #1a2d52;
      --h-student:  #1a4a26;
      --h-prof:     #3b1a52;
      --h-emp:      #1a3a5c;
      --h-room:     #4a3010;
      --h-comp:     #4a1030;
      --h-res:      #0d3a4a;
      --h-loan:     #0d4040;
      --h-fine:     #4a1010;
      --h-audit:    #282828;
      --h-svc:      #0d3a20;
      --h-ctrl:     #1f3a0d;
      --h-auth:     #3a0d3a;
      --h-dto:      #2a2a0d;

      /* accents */
      --acc-inh:  #58a6ff;
      --acc-impl: #3fb950;
      --acc-comp: #f85149;
      --acc-aggr: #d29922;
      --acc-assoc:#79c0ff;
      --acc-dep:  #a371f7;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Top bar ── */
    .topbar {
      position: fixed; top:0; left:0; right:0; z-index:100;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px;
      gap: 16px;
    }
    .topbar-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800; font-size: 0.95rem;
      color: var(--text); letter-spacing: -0.3px;
    }
    .topbar-sub {
      font-size: 0.65rem; color: var(--muted);
    }
    .topbar-sep { width:1px; height:24px; background: var(--border); }

    /* ── Legend pills ── */
    .legend { display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; }
    .leg {
      display:flex; align-items:center; gap:5px;
      font-size: 0.6rem; color: var(--muted);
      padding: 3px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .leg-line { width:22px; height:2px; border-radius:2px; }
    .leg-dash { width:22px; height:0; border-top:2px dashed; }

    /* ── Controls ── */
    .controls {
      position: fixed; bottom:20px; right:20px; z-index:100;
      display:flex; flex-direction:column; gap:6px;
    }
    .ctrl-btn {
      width:36px; height:36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem; font-family: 'Syne', sans-serif; font-weight:700;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition: background 0.15s, border-color 0.15s;
    }
    .ctrl-btn:hover { background: var(--surface2); border-color: var(--acc-assoc); }

    /* ── Canvas wrapper ── */
    #canvas-wrap {
      position: fixed; top:52px; left:0; right:0; bottom:0;
      overflow: hidden; cursor: grab;
    }
    #canvas-wrap:active { cursor: grabbing; }

    svg {
      display: block;
      transform-origin: 0 0;
    }

    /* ── Class box base ── */
    .cls-wrap { cursor: default; }

    .cls-bg {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 1;
    }
    .cls-bg-abstract { fill:#1a1630; stroke:#4a3a9e; }
    .cls-bg-iface    { fill:#0d1f18; stroke:#2ea043; }
    .cls-bg-entity   { stroke:#2d4a8a; }
    .cls-bg-student  { stroke:#2a6e3a; }
    .cls-bg-prof     { stroke:#7a3a9e; }
    .cls-bg-emp      { stroke:#2a5a8e; }
    .cls-bg-room     { stroke:#8e6a20; }
    .cls-bg-comp-eq  { stroke:#8e203a; }
    .cls-bg-res      { stroke:#205a7a; }
    .cls-bg-loan     { stroke:#206060; }
    .cls-bg-fine     { stroke:#8e2020; }
    .cls-bg-audit    { stroke:#505050; }
    .cls-bg-svc      { fill:#0a1a10; stroke:#2a6040; }
    .cls-bg-ctrl     { fill:#0d180a; stroke:#3a6020; }
    .cls-bg-auth     { fill:#1a0a1a; stroke:#7a3a7a; }
    .cls-bg-dto      { fill:#18180a; stroke:#6a6a20; }

    .cls-hdr { rx:6; }
    .cls-hdr-abstract { fill: var(--h-abstract); }
    .cls-hdr-iface    { fill: var(--h-iface); }
    .cls-hdr-entity   { fill: var(--h-entity); }
    .cls-hdr-student  { fill: var(--h-student); }
    .cls-hdr-prof     { fill: var(--h-prof); }
    .cls-hdr-emp      { fill: var(--h-emp); }
    .cls-hdr-room     { fill: var(--h-room); }
    .cls-hdr-comp-eq  { fill: var(--h-comp); }
    .cls-hdr-res      { fill: var(--h-res); }
    .cls-hdr-loan     { fill: var(--h-loan); }
    .cls-hdr-fine     { fill: var(--h-fine); }
    .cls-hdr-audit    { fill: var(--h-audit); }
    .cls-hdr-svc      { fill: var(--h-svc); }
    .cls-hdr-ctrl     { fill: var(--h-ctrl); }
    .cls-hdr-auth     { fill: var(--h-auth); }
    .cls-hdr-dto      { fill: var(--h-dto); }

    .stereo { font-size:8px; fill:#a0aab8; font-weight:400; }
    .cls-name { font-size:11.5px; font-weight:700; fill:#e6edf3; font-family:'Syne',sans-serif; }
    .cls-name-ital { font-style:italic; }
    .sect-lbl { font-size:7.5px; fill:#6e7a8a; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
    .attr-line { font-size:8.5px; fill:#c9d1d9; }
    .vis-priv { fill:#f85149; font-weight:700; }
    .vis-prot { fill:#d29922; font-weight:700; }
    .vis-pub  { fill:#3fb950; font-weight:700; }
    .vis-pkg  { fill:#79c0ff; font-weight:700; }
    .divider  { stroke: var(--border); stroke-width:0.8; }
    .sect-div { stroke:#2a3040; stroke-width:0.6; stroke-dasharray:3,3; }

    /* ── Relationship lines ── */
    .rel { fill:none; }
    .r-inh  { stroke: var(--acc-inh);  stroke-width:1.8; }
    .r-impl { stroke: var(--acc-impl); stroke-width:1.5; stroke-dasharray:7,4; }
    .r-comp { stroke: var(--acc-comp); stroke-width:1.6; }
    .r-aggr { stroke: var(--acc-aggr); stroke-width:1.5; }
    .r-assoc{ stroke: var(--acc-assoc);stroke-width:1.3; }
    .r-dep  { stroke: var(--acc-dep);  stroke-width:1.2; stroke-dasharray:5,3; }

    .rlbl { font-size:8.5px; fill:#8b949e; font-family:'JetBrains Mono',monospace; }
    .rcard{ font-size:9px; fill:#d29922; font-weight:700; font-family:'JetBrains Mono',monospace; }
    .rname{ font-size:8px; fill:#79c0ff; font-family:'Syne',sans-serif; font-weight:600; }

    /* ── Tooltip ── */
    .tooltip {
      position:fixed; pointer-events:none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius:6px; padding:8px 12px;
      font-size:0.7rem; color:var(--muted);
      z-index:200; display:none;
      max-width:240px; line-height:1.6;
    }

    /* ── Layer labels ── */
    .layer-bg { fill:#1a1f2a; rx:4; opacity:0.5; }
    .layer-lbl { font-size:8px; fill:#3d5070; font-family:'Syne',sans-serif; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
  </style>
</head>

<div class="controls">
  <button class="ctrl-btn" id="zin" title="Acercar">+</button>
  <button class="ctrl-btn" id="zout" title="Alejar">−</button>
  <button class="ctrl-btn" id="zfit" title="Ajustar" style="font-size:0.65rem">FIT</button>
  <button class="ctrl-btn" id="zreset" title="100%" style="font-size:0.65rem">1:1</button>
</div>

<script>
  const wrap = document.getElementById('canvas-wrap');
  const svg  = document.getElementById('diagram');
  let scale = 0.48, ox = 60, oy = 20;
  let dragging = false, sx = 0, sy = 0, sox = 0, soy = 0;

  function applyTransform() {
    svg.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
  }
  applyTransform();

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const delta = e.deltaY < 0 ? 1.1 : 0.9;
    ox = mx - (mx - ox) * delta;
    oy = my - (my - oy) * delta;
    scale = Math.min(3, Math.max(0.1, scale * delta));
    applyTransform();
  }, {passive: false});

  wrap.addEventListener('mousedown', e => {
    if(e.button !== 0) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    sox = ox; soy = oy;
  });
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    ox = sox + (e.clientX - sx);
    oy = soy + (e.clientY - sy);
    applyTransform();
  });
  window.addEventListener('mouseup', () => dragging = false);

  document.getElementById('zin').onclick = () => {
    scale = Math.min(3, scale * 1.2);
    applyTransform();
  };
  document.getElementById('zout').onclick = () => {
    scale = Math.max(0.1, scale / 1.2);
    applyTransform();
  };
  document.getElementById('zfit').onclick = () => {
    scale = 0.48; ox = 60; oy = 20; applyTransform();
  };
  document.getElementById('zreset').onclick = () => {
    scale = 1; ox = 0; oy = 0; applyTransform();
  };

  // Touch support
  let lastDist = 0, lox = 0, loy = 0, ltx = 0, lty = 0;
  wrap.addEventListener('touchstart', e => {
    if(e.touches.length === 2) {
      lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
              e.touches[0].clientY-e.touches[1].clientY);
    } else if(e.touches.length === 1) {
      dragging = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      sox = ox; soy = oy;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', e => {
    if(e.touches.length === 2) {
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
              e.touches[0].clientY-e.touches[1].clientY);
      scale = Math.min(3, Math.max(0.1, scale * d / lastDist));
      lastDist = d; applyTransform();
    } else if(dragging && e.touches.length === 1) {
      ox = sox + (e.touches[0].clientX - sx);
      oy = soy + (e.touches[0].clientY - sy);
      applyTransform();
    }
  }, {passive:false});
  wrap.addEventListener('touchend', () => { dragging = false; });
</script>
